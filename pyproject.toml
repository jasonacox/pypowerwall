[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypowerwall"
description = "Python module to access Tesla Energy Gateway for Powerwall and solar power data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Jason Cox", email = "jason@jasonacox.com"},
]
dependencies = [
    "requests",
    "httpx[http2]>=0.27.0",
    "protobuf>=4.25.1",
    "python-dotenv",
    "pyroute2",
    "bs4",
    "python-dateutil",
    "requests-oauthlib",
    "websocket-client>=0.59.0",
    "cryptography",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jasonacox/pypowerwall"

[project.scripts]
pypowerwall = "pypowerwall.__main__:main"

[tool.setuptools]
include-package-data = true

# Explicit discovery: the repo root contains other importable trees
# (proxy/, tools/, pwsimulator/) that must never ship in the distribution.
[tool.setuptools.packages.find]
include = ["pypowerwall*"]

[tool.setuptools.package-data]
"pypowerwall.cloud.teslapy" = ["endpoints.json", "option_codes.json"]
# TEDAPI query sets are loaded from JSON at runtime — must ship in the wheel.
"pypowerwall.tedapi.queries" = ["*.json"]

# Version is the plain __version__ literal in pypowerwall/__init__.py.
# attr: AST-reads the literal at build time — no import, no regex.
[tool.setuptools.dynamic]
version = {attr = "pypowerwall.__version__"}
